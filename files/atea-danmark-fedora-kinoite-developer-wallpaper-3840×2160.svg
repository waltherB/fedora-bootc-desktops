<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="fedora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51a2da"/>
      <stop offset="1" stop-color="#294172"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0096d6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0096d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#51a2da" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#51a2da" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- ambient glows -->
  <ellipse cx="3300" cy="350" rx="900" ry="600" fill="#51a2da" opacity="0.10" filter="url(#blur)"/>
  <ellipse cx="300" cy="1900" rx="900" ry="650" fill="#0096d6" opacity="0.09" filter="url(#blur)"/>

  <!-- code bracket motif -->
  <g fill="none" stroke-linecap="round" opacity="0.16">
    <path d="M1180 780 L820 1080 L1180 1380" stroke="#51a2da" stroke-width="26"/>
    <path d="M2660 780 L3020 1080 L2660 1380" stroke="#51a2da" stroke-width="26"/>
    <path d="M1560 1080 H1900 M2020 1080 H2280" stroke="#0096d6" stroke-width="26"/>
    <circle cx="1950" cy="1080" r="46" stroke="#0096d6" stroke-width="22"/>
  </g>

  <!-- subtle code lines, left side (kept away from icons/panel zones) -->
  <g font-family="monospace" font-size="44" opacity="0.28">
    <text x="260" y="620" fill="#5c7aa6">$ rpm-ostree status</text>
    <text x="260" y="700" fill="#7fb3e8">ostree://fedora:44</text>
    <text x="260" y="780" fill="#5c7aa6">Tiered: kinomite · KDE Plasma 6</text>
    <text x="260" y="860" fill="#4a6a92">$ flatpak list --runtime</text>
    <text x="260" y="940" fill="#4a6a92">$ podman ps --format "{{.Names}}"</text>
    <text x="260" y="1020" fill="#3a5578">toolbox: dev · node22 · go1.24</text>
  </g>

  <!-- top accent line -->
  <rect x="0" y="0" width="3840" height="6" fill="url(#glow)"/>

  <!-- title, subtle -->
  <g font-family="monospace">
    <text x="2980" y="2060" fill="#5c7aa6" font-size="42" opacity="0.7" text-anchor="start">FEDORA 44 KINOTE · DEVELOPER</text>
  </g>

  <!-- Atea logo, bottom-right -->
  <g transform="translate(2570,1880)">
    <text x="0" y="130" font-family="Arial, Helvetica, sans-serif" font-size="190" font-weight="bold" letter-spacing="4" fill="#0096d6">atea</text>
    <text x="418" y="130" font-family="Arial, Helvetica, sans-serif" font-size="64" fill="#8fd0f0" opacity="0.9"> danmark</text>
    <rect x="0" y="170" width="620" height="6" rx="3" fill="url(#glow)"/>
  </g>
</svg>